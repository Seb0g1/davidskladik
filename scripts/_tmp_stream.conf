map $ssl_preread_server_name $sni_name {
      hostnames;
      dvpn2.davidsklad.ru      xray;
      dvpn1.davidsklad.ru      www;
      davidsklad.ru            davidsklad;
      www.davidsklad.ru        davidsklad;
      magicvibes.ru            magicvibes;
      www.magicvibes.ru        magicvibes;
      default                  xray;
  }

  upstream xray       { server 127.0.0.1:8443; }
  upstream www        { server 127.0.0.1:7443; }
  upstream davidsklad { server 127.0.0.1:9443; }
  upstream magicvibes { server 127.0.0.1:6443; }

  server {
      listen          443;
      proxy_pass      $sni_name;
      ssl_preread     on;
 }
