    # map for the delivery picker (/map/; /ofm/ kept for old bundles): OpenFreeMap through our domain (see /etc/nginx/conf.d/ofm-cache.conf)
    location = /map/planet {
        proxy_pass https://tiles.openfreemap.org/planet;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.openfreemap.org;
        # OpenFreeMap sends its own Access-Control-Allow-Origin: two of them («*, *») make browsers drop the tiles
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_cache ofm;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        sub_filter_types application/json;
        sub_filter "https://tiles.openfreemap.org" "https://magicvibes.ru/map";
        sub_filter_once off;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /map/ {
        proxy_pass https://tiles.openfreemap.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host tiles.openfreemap.org;
        # OpenFreeMap sends its own Access-Control-Allow-Origin: two of them («*, *») make browsers drop the tiles
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_cache ofm;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

