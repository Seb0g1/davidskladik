server {
    server_name magicvibes.ru www.magicvibes.ru;

    # Hide nginx version in Server header
    server_tokens off;

    root /var/www/magicvibes;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Security headers ────────────────────────────────────────────────────────
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Block framing from any external origin
    add_header X-Frame-Options "DENY" always;
    # HSTS: browsers enforce HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Limit referrer info sent to third-party sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Disable unnecessary browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: tighten as needed; unsafe-inline is required for inline styles/scripts used by the React SPA
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://davidsklad.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # ────────────────────────────────────────────────────────────────────────────

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers apply globally above; override Cache-Control for assets
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/magicvibes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicvibes.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name magicvibes.ru www.magicvibes.ru;
    return 301 https://$host$request_uri;
}
