# magicvibes.ru — Next.js 15 (shop-next) reverse proxy
# Port 3002 → shop-next (PM2 process «shop-next»)
# NOTE: Port 443 is handled by nginx stream module (ssl_preread → routes to 6443).
#       This file only handles 6443 (where stream sends magicvibes.ru traffic).

# ── HTTPS via stream (port 6443) ──────────────────────────────────────────────
server {
    server_name magicvibes.ru www.magicvibes.ru;

    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1000;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 6443 ssl;
    ssl_certificate     /etc/letsencrypt/live/magicvibes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicvibes.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name magicvibes.ru www.magicvibes.ru;
    return 301 https://$host$request_uri;
}
