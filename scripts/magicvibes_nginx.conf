# magicvibes.ru — Next.js 15 (shop-next) reverse proxy
# Port 3002 → shop-next (PM2 process «shop-next»)
# Generated by deploy-prod.cjs, do not edit manually on the server.

# ── HTTPS (443) ──────────────────────────────────────────────────────────────
server {
    server_name magicvibes.ru www.magicvibes.ru;

    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1000;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()" always;
    # unsafe-inline required for Next.js inline scripts/styles
    add_header Content-Security-Policy     "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://davidsklad.ru; media-src 'self' blob:; frame-src https://www.youtube.com https://youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Next.js static assets — immutable, 1-year cache ──────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Next.js image optimiser ────────────────────────────────────────────
    location /_next/image {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── All other requests → Next.js ───────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/magicvibes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicvibes.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTPS alternative port (6443) ─────────────────────────────────────────────
server {
    server_name magicvibes.ru www.magicvibes.ru;

    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1000;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/image {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 6443 ssl;
    ssl_certificate     /etc/letsencrypt/live/magicvibes.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicvibes.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name magicvibes.ru www.magicvibes.ru;
    return 301 https://$host$request_uri;
}
