name: deploy-prod

on:
  push:
    branches:
      - main
    tags:
      - "prod-*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Только линты + unit-тесты: security/smoke зависают в CI (нет живого сервера и БД)
      - run: npm run lint:computed-fields && npm run lint:source-manifest && npm run lint:queue-priorities && npm run lint:warehouse-cache && npm run lint:regex-exec
      - run: node --test test/unit.test.cjs
      - run: npm run build
      - run: node scripts/deploy-prod.cjs --skip-local-checks
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
