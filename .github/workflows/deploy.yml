name: deploy-prod

on:
  push:
    tags:
      - "prod-*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/deploy-prod.cjs --skip-local-checks
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
