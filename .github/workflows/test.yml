name: test

on:
  push:
    branches:
      - codex/restore-4dfc0cb
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # security.test.cjs и ops-diagnose зависают в CI (нет живого сервера и БД)
      - run: npm run lint:computed-fields && npm run lint:source-manifest && npm run lint:queue-priorities && npm run lint:warehouse-cache && npm run lint:regex-exec
      - run: node --test test/unit.test.cjs
