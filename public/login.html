<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06111f" />
    <title>Вход | DavidSklad</title>
    <link rel="icon" type="image/png" href="/logo1.png" />
    <link rel="apple-touch-icon" href="/logo1.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-brand-panel" aria-label="DavidSklad">
        <div class="login-brand-lockup">
          <span class="login-brand-mark" aria-hidden="true">D</span>
          <h1>David<span>Sklad</span></h1>
        </div>
        <div class="login-dashboard-preview">
          <div class="login-preview-top">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="login-preview-grid">
            <article><small>Активных товаров</small><strong>7 892</strong></article>
            <article><small>Очередь цен</small><strong>126</strong></article>
            <article><small>Ожидают сборки</small><strong>58</strong></article>
          </div>
          <div class="login-preview-table">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>
      <section class="login-card">
        <div class="login-card-head">
          <span class="login-eyebrow">Рабочий интерфейс</span>
          <h2>Вход в кабинет</h2>
        </div>
        <form id="loginForm">
          <label>
            Логин
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            Пароль
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary-button" type="submit">Войти</button>
        </form>
        <div class="login-divider"><span>или</span></div>
        <button id="yandexLoginBtn" class="yandex-login-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0z" fill="#FC3F1D"/>
            <path d="M13.32 7.12h-.92c-1.44 0-2.2.68-2.2 1.8 0 1.26.56 1.9 1.72 2.7l.96.64-2.76 4.14H8.3l2.54-3.8c-1.46-1.04-2.28-2.06-2.28-3.6 0-2.04 1.42-3.4 3.8-3.4h2.88v10.8H13.3V7.12z" fill="#fff"/>
          </svg>
          Войти с Яндекс ID
        </button>
        <div id="loginError" class="login-error"></div>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
