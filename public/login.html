<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Вход | Magic Vibes - Склад</title>
    <link rel="icon" type="image/png" href="/logo1.png" />
    <link rel="apple-touch-icon" href="/logo1.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1 class="site-brand site-brand--compact"><span class="brand-name">Magic Vibes</span><span class="brand-sep"> — </span><span class="brand-tag">Склад</span></h1>
      <p>Войдите, чтобы открыть товары маркетплейсов, привязки PriceMaster и управление ценами.</p>
      <form id="loginForm">
        <label>
          Логин
          <input name="username" autocomplete="username" required />
        </label>
        <label>
          Пароль
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary-button" type="submit">Войти</button>
      </form>
      <div id="loginError" class="login-error"></div>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
