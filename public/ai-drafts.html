<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI drafts | Magic Vibes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell import-page-shell">
      <section class="panel import-hero-panel">
        <div>
          <p class="eyebrow">AI review</p>
          <h1>AI drafts</h1>
          <p class="muted-text">Черновики описаний и фото для карточек. Изменения применяются только после одобрения.</p>
        </div>
        <div class="header-actions">
          <a class="secondary-link-button compact-button" href="/operations.html">Операции</a>
          <a class="secondary-link-button compact-button" href="/">Склад</a>
        </div>
      </section>

      <section class="panel import-toolbar-panel">
        <div class="import-toolbar">
          <label class="search-control">
            Статус
            <select id="draftStatusSelect">
              <option value="pending" selected>На проверке</option>
              <option value="approved">Принятые</option>
              <option value="rejected">Отклоненные</option>
              <option value="">Все</option>
            </select>
          </label>
          <label class="search-control">
            Маркетплейс
            <select id="draftMarketplaceSelect">
              <option value="yandex" selected>Yandex Market</option>
              <option value="ozon">Ozon</option>
              <option value="">Все</option>
            </select>
          </label>
          <button id="refreshDraftsButton" class="secondary-button" type="button">Обновить</button>
        </div>
        <div id="draftStatus" class="sync-status-pill">Загружаю...</div>
      </section>

      <section class="panel import-list-panel">
        <div class="import-list-head">
          <h2>Черновики</h2>
        </div>
        <div id="draftsList" class="history-list"></div>
      </section>
    </main>
    <script src="/ai-drafts.js"></script>
  </body>
</html>
