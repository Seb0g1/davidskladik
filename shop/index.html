<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon: SVG + PNG + ICO для всех браузеров и Яндекса -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="theme-color" content="#09090b" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Magic Vibes — Оригинальный парфюм с доставкой по России</title>
    <meta name="description" content="Купить оригинальный парфюм в Magic Vibes. 22 000+ ароматов: Chanel, Dior, Tom Ford, Montale, Byredo. Доставка по всей России. Гарантия подлинности. Рейтинг 4.9 на Ozon." />
    <meta name="keywords" content="парфюм купить, оригинальный парфюм, интернет-магазин парфюмерии, парфюм с доставкой, духи купить, Chanel, Dior, Tom Ford, Montale, Byredo, туалетная вода, парфюмерная вода" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://magicvibes.ru/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://magicvibes.ru/" />
    <meta property="og:site_name" content="Magic Vibes" />
    <meta property="og:title" content="Magic Vibes — Оригинальный парфюм с доставкой по России" />
    <meta property="og:description" content="22 000+ оригинальных ароматов мировых брендов. Chanel, Dior, Tom Ford, Montale, Byredo. Доставка 1–5 дней. Гарантия подлинности." />
    <meta property="og:image" content="https://magicvibes.ru/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Magic Vibes — Оригинальный парфюм с доставкой" />
    <meta name="twitter:description" content="22 000+ ароматов. Chanel, Dior, Tom Ford и другие бренды. Гарантия подлинности." />
    <meta name="twitter:image" content="https://magicvibes.ru/og-image.jpg" />

    <!-- Yandex verification (добавить ключ из Яндекс Вебмастера) -->
    <!-- <meta name="yandex-verification" content="XXXXXXXXXXXXXXXX" /> -->

    <!-- Google Search Console verification -->
    <!-- <meta name="google-site-verification" content="XXXXXXXXXXXXXXXX" /> -->

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Magic Vibes",
      "url": "https://magicvibes.ru",
      "logo": "https://magicvibes.ru/favicon.svg",
      "description": "Оригинальная парфюмерия мировых брендов с доставкой по России",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "info@magicvibes.ru",
        "availableLanguage": "Russian"
      },
      "sameAs": ["https://t.me/magicvibes_ru"]
    }
    </script>

    <!-- WebSite JSON-LD with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Magic Vibes",
      "url": "https://magicvibes.ru",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://magicvibes.ru/catalog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
    <style>
      /* Leaflet popup custom style */
      .pvz-leaflet-popup .leaflet-popup-content-wrapper {
        border-radius: 16px;
        padding: 0;
        box-shadow: 0 16px 48px rgba(0,0,0,0.18), 0 4px 12px rgba(0,0,0,0.1);
        border: 1px solid rgba(0,0,0,0.06);
        overflow: hidden;
      }
      .pvz-leaflet-popup .leaflet-popup-content { margin: 16px 18px; }
      .pvz-leaflet-popup .leaflet-popup-tip-container { display: none; }
      .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 16px rgba(0,0,0,0.1) !important; border-radius: 12px !important; overflow: hidden; }
      .leaflet-control-zoom a { background: rgba(255,255,255,0.95) !important; backdrop-filter: blur(8px); color: #374151 !important; font-size: 16px !important; line-height: 30px !important; width: 34px !important; height: 34px !important; border: none !important; transition: background 0.15s !important; }
      .leaflet-control-zoom a:hover { background: #f5f0e8 !important; color: #C9A96E !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
